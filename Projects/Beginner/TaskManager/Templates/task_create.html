{% extends 'base.html' %}

{% block content %}
<!-- CSS to make {{ form.as_p }} look good with Tailwind -->
<style>
    /* target the inputs generated by django */
    form p { margin-bottom: 1rem; }
    form p label { display: block; font-weight: 500; color: #374151; margin-bottom: 0.5rem; }
    form p input, form p textarea, form p select {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
    }
</style>

<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            Create a New Task
        </h2>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
        
            <form method="post">
                {% csrf_token %}
                
                {{ form.as_p }}

                <div class="mt-6">
                    <button value="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Create
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
