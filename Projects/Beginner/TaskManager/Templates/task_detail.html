{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <!-- 1. TOP NAVIGATION (Back Button) -->
    <div class="mb-6">
        <a href="{% url 'task' %}" class="flex items-center text-sm text-gray-500 hover:text-gray-700 transition">
            <svg class="mr-1 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Dashboard
        </a>
    </div>

    <!-- 2. MAIN CARD -->
    <div class="bg-white shadow overflow-hidden sm:rounded-lg">
        
        <!-- CARD HEADER -->
        <div class="px-4 py-5 sm:px-6 flex justify-between items-start">
            <div>
                <h3 class="text-2xl font-bold leading-6 text-gray-900">
                    {{ task.title }}
                </h3>
                <p class="mt-2 max-w-2xl text-sm text-gray-500">
                    <!-- Your Logic: Owner -->
                    Owned by: <span class="font-medium text-gray-900">{{ task.owner }}</span>
                </p>
            </div>
            
            <!-- Your Logic: Status (Styled as a badge) -->
            <span class="px-3 py-1 inline-flex text-sm leading-5 font-semibold rounded-full bg-indigo-100 text-indigo-800">
                {{ task.status }}
            </span>
        </div>

        <!-- CARD BODY (Data Grid) -->
        <div class="border-t border-gray-200 px-4 py-5 sm:p-0">
            <dl class="sm:divide-y sm:divide-gray-200">
                
                <!-- Description Section -->
                <div class="py-4 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                    <dt class="text-sm font-medium text-gray-500">
                        Description
                    </dt>
                    <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2 whitespace-pre-line">
                        <!-- Your Logic: Description -->
                        {{ task.description }}
                    </dd>
                </div>

                <!-- Due Date Section -->
                <div class="py-4 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                    <dt class="text-sm font-medium text-gray-500">
                        Due Date
                    </dt>
                    <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">
                        <!-- Your Logic: Due Date -->
                        <div class="flex items-center">
                            <svg class="flex-shrink-0 mr-1.5 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            {{ task.due_date }}
                        </div>
                    </dd>
                </div>

            </dl>
        </div>

        <!-- 3. ACTION FOOTER (Edit/Delete Buttons) -->
        <div class="bg-gray-50 px-4 py-4 sm:px-6 flex justify-end space-x-3">
            
            <!-- DELETE BUTTON (Red) -->
            <!-- Note: We use task.pk to tell Django WHICH task to delete -->
            <a href="{% url 'task_delete' task.pk %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-red-700 bg-red-100 hover:bg-red-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                Delete
            </a>

            <!-- EDIT BUTTON (Indigo) -->
            <!-- Note: We use task.pk to tell Django WHICH task to edit -->
            <a href="{% url 'task_edit' task.pk %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Edit Task
            </a>
            
        </div>
    </div>
</div>
{% endblock %}
