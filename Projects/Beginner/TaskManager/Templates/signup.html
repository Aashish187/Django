{% extends 'base.html' %}
{% block content %}
<!-- CSS to make Django's UserCreationForm look professional -->
<style>
    form p { margin-bottom: 1rem; }
    form p label { display: block; font-weight: 500; color: #374151; margin-bottom: 0.5rem; }
    /* Input Styling */
    form p input {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
    }
    form p input:focus {
        outline: 2px solid #4f46e5;
        border-color: #4f46e5;
    }

    /* SPECIFIC TO SIGNUP: Style the password help text */
    form span.helptext {
        display: block;
        margin-top: 0.25rem;
        font-size: 0.75rem; /* Make it small */
        color: #6b7280;     /* Make it gray */
    }
    
    /* Style Validation Errors (if they type a bad password) */
    ul.errorlist {
        margin-bottom: 1rem;
        color: #dc2626; /* Red */
        font-size: 0.875rem;
    }
</style>

<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    
    <!-- HEADER -->
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            Create an Account
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            Already have an account?
            <a href="{% url 'login' %}" class="font-medium text-indigo-600 hover:text-indigo-500">
                Sign in here
            </a>
        </p>
    </div>

    <!-- FORM CARD -->
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            
            <form method="post">
                {% csrf_token %}
                <!-- The form renders Username, Password, Password Confirm -->
                {{ form.as_p }}

                <div class="mt-6">
                    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Sign Up
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock content %}
